<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>DJMRN X34 owner camera and own geometry</title><style>body{margin:0;background:#071821;color:#eaffed;font:13px sans-serif}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
const store={ready:false,errors:[]};window.__DJMRN_X34_VIEWER=store;
try{
 const loader=new GLTFLoader();
 const [camGltf,gridGltf]=await Promise.all([loader.loadAsync("/owner-camera.glb"),loader.loadAsync("/owner-grid.glb")]);
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x071821);
 scene.add(camGltf.scene);scene.add(gridGltf.scene);
 gridGltf.scene.position.set(.50,1.2,0);
 gridGltf.scene.traverse(x=>{if(x.isMesh)x.material=new THREE.MeshBasicMaterial({color:0x81ddb0,side:THREE.DoubleSide});});
 const cam=camGltf.cameras[0];if(!cam)throw Error("NO_AUTHORED_CAMERA");
 const mixer=new THREE.AnimationMixer(camGltf.scene);camGltf.animations.forEach(clip=>mixer.clipAction(clip).play());
 const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"low-power"});
 renderer.setSize(920,590);renderer.setPixelRatio(1);document.body.appendChild(renderer.domElement);
 scene.add(new THREE.AmbientLight(0xffffff,1.0));
 const marker=new THREE.Mesh(new THREE.SphereGeometry(.12,10,10),new THREE.MeshBasicMaterial({color:0xf6c484}));
 marker.position.set(0,1.1,0);scene.add(marker);
 cam.updateMatrixWorld(true);
 const getPos=()=>{cam.updateMatrixWorld(true);return [...cam.getWorldPosition(new THREE.Vector3()).toArray()].map(x=>+x.toFixed(5))};
 store.initialPosition=getPos();
 renderer.render(scene,cam);
 store.sceneNodes=gridGltf.scene.children.length;
 store.animationClips=camGltf.animations.map(c=>({name:c.name,trackCount:c.tracks.length,duration:+c.duration.toFixed(5),paths:c.tracks.map(t=>t.name)}));
 store.glVersion=renderer.getContext().getParameter(renderer.getContext().VERSION);
 const dbg=renderer.getContext().getExtension("WEBGL_debug_renderer_info");
 store.unmaskedRenderer=dbg?renderer.getContext().getParameter(dbg.UNMASKED_RENDERER_WEBGL):null;
 store.ready=true;
 window.__DJMRN_X34_ADVANCE=(seconds)=>{mixer.update(seconds);renderer.render(scene,cam);store.advancedPosition=getPos();
 store.cameraActuallyMoved=store.initialPosition.some((x,i)=>Math.abs(x-store.advancedPosition[i])>0.0001);return store};
}catch(e){store.errors.push(String(e.stack||e))}
</script></body></html>
